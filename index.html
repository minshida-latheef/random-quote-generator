<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Spark | Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="tag">Daily Spark</p>
    <blockquote id="quote">"Simplicity is the ultimate sophistication."</blockquote>
    <p id="author">— Leonardo da Vinci</p>
    <div class="actions">
      <button id="new-quote-btn">New Inspiration</button>
      <button id="copy-btn" class="secondary">Copy</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
